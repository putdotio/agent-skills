name: Publish Skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/publish-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      TESSL_AUTO_UPDATE_INTERVAL_MINUTES: "0"
      TESSL_THRESHOLD: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Review skills with Tessl
        run: ./scripts/review-skills.sh

  publish:
    needs: review
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    concurrency:
      group: publish-skills-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.PUTIO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release-bot.outputs.token }}

      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Authorize version-bump pushes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git

      - name: Publish changed tiles
        uses: uinaf/tessl-publish-action@c886763f2a95d6971317fd4b8abe88679619ebad # v2.1.2
        with:
          review-threshold: "90"
          git-author-name: putio-release-bot[bot]
          git-author-email: 283001373+putio-release-bot[bot]@users.noreply.github.com
          git-committer-name: putio-release-bot[bot]
          git-committer-email: 283001373+putio-release-bot[bot]@users.noreply.github.com
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
