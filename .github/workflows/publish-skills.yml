name: Publish Skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/publish-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    env:
      TESSL_AUTO_UPDATE_INTERVAL_MINUTES: "0"
      TESSL_THRESHOLD: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Review skills with Tessl
        run: ./scripts/review-skills.sh

  publish:
    needs: review
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    concurrency:
      group: publish-skills-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.PUTIO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.release-bot.outputs.token }}

      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Authorize version-bump pushes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git

      - name: Publish changed tiles
        env:
          PUBLISH_BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_AFTER_SHA: ${{ github.sha }}
          PUBLISH_DRY_RUN: "false"
        run: ./scripts/publish-skills.sh

      - name: Commit published versions
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          if git diff --quiet -- skills; then
            echo "No version bump changes needed."
            exit 0
          fi

          git config user.name "putio-release-bot[bot]"
          git config user.email "283001373+putio-release-bot[bot]@users.noreply.github.com"
          git add skills
          git commit -m "chore: sync published tile versions [skip ci]"
          git push origin HEAD:main
