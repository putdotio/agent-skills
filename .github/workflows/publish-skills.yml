name: Publish Skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      TESSL_AUTO_UPDATE_INTERVAL_MINUTES: "0"
      TESSL_THRESHOLD: "90"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Review skills with Tessl
        run: ./scripts/review-skills.sh

  publish:
    needs: review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: release
      deployment: false
    permissions:
      contents: read
    steps:
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        with:
          client-id: ${{ vars.PUTIO_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PUTIO_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.release-bot.outputs.token }}

      - name: Set up Tessl
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e # v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Publish changed tiles
        uses: uinaf/tessl-publish-action@5ff92c38ef055dadf9bf2ecb748651ce799ace25 # v2.1.1
        with:
          review-threshold: "90"
          git-author-name: putio-release-bot[bot]
          git-author-email: 283001373+putio-release-bot[bot]@users.noreply.github.com
          git-committer-name: putio-release-bot[bot]
          git-committer-email: 283001373+putio-release-bot[bot]@users.noreply.github.com
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
