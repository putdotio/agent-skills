interface:
  display_name: "put.io SDK Dev"
  short_description: "Develop or review put.io SDKs"
  default_prompt: |
    Use $putio-sdk-dev.

    Goal: develop or review a put.io SDK with public, domain-first typed contracts matching verified backend behavior and app usage.

    Read repo guidance and inspect the target namespace and transport first. Check backend behavior/tests, current first-party usage, and maintained sibling SDKs in source-of-truth order. Update request, response, error, tests, docs, and safe live proof together when the public surface changes. Apply the shared supply-chain checklist to release or signing work.

    Boundaries: widen scope only from verified behavior and consumer need. Keep shared-account tests non-destructive, delivery paths on trusted refs, TypeScript type-safe, and repo-specific guidance with its owner.

    Output: summarize SDK surface changed or reviewed, evidence sources, verification run, parity or non-parity decisions, gaps, and next step.

    Stop rules: stop and ask or report blocked when backend behavior, app usage, safe live-test access, or package release implications cannot be verified.
