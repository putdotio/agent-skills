interface:
  display_name: "put.io Frontend Patterns"
  short_description: "Apply put.io frontend code patterns"
  default_prompt: |
    Use $putio-frontend-patterns.

    Goal: apply put.io frontend code patterns or seed `.patterns/` with the repo's real conventions.

    Inspect the stack, guidance, and relevant patterns first. Apply schema-driven boundaries, parse external input, make impossible states impossible, model bug-sensitive flows explicitly, and localize expected errors. Record only non-obvious repo choices without duplicating contributor docs.

    Boundaries: use $putio-frontend-repos for repo shape/delivery and $putio-sdk-dev for SDKs. Explicit repo-local patterns override shared defaults.

    Output: summarize code or pattern files changed, repo conventions found, verification run, exceptions, gaps, and next step.

    Stop rules: stop and ask when repo-local conventions conflict with this skill or the required stack behavior cannot be verified.
