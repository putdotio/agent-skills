interface:
  display_name: "put.io Frontend Repos"
  short_description: "Standardize repo docs, delivery, and proof loops"
  default_prompt: |
    Use $putio-frontend-repos.

    Goal: make a put.io frontend repo documented, verifiable, and continuously deliverable from `main`.

    Inspect repo kind, docs, verify, delivery target, proof harness, versioning, and templates. Keep docs aligned, make CI verify before delivery, and expose stable proof entrypoints for owned runtime validation. Preserve working delivery plumbing unless evidence conflicts. Secret-bearing paths use trusted refs, validated inputs, and scoped credentials.

    Boundaries: repository policy, generic Actions hardening, provider internals, readiness repair, Vite+ migration, and self-verification belong elsewhere. Preserve verify as the automatic and manual delivery gate; keep secrets in secret stores.

    Output: summarize changed docs/config/harness, verify shape, delivery target, proof, risks, gaps, and next step.

    Stop rules: block when verify is not reproducible or delivery credentials, target, or branch rules cannot be confirmed safely.
